name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project targets and schemes
        run: xcodebuild -list -project ItaliaHobbyMotociclismo.xcodeproj

      - name: Build
        run: |
          xcodebuild \
            -project ItaliaHobbyMotociclismo.xcodeproj \
            -target ItaliaHobbyMotociclismo \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
